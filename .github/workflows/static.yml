name: Deploy static content to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare public artifact
        run: |
          mkdir _site
          rsync -a --delete \
            --exclude '.zed' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'my_content' \
            --exclude 'TODO.md' \
            --exclude 'PROGRESS.md' \
            ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
