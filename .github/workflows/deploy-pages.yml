name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public artifact
        run: |
          mkdir _site
          rsync -a --delete \
            --exclude '.zed' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'my_content' \
            --exclude 'TODO.md' \
            --exclude 'PROGRESS.md' \
            ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
